# xcodegen 用プロジェクト定義。
# CI で `xcodegen generate` を叩くと ViviMusic.xcodeproj が生成される。
# ゆえに *.xcodeproj / *.xcworkspace はコミット不要。
#
# Flutter 版との最大の違い:
#   CocoaPods も Flutter SDK も使わないため、Podfile 生成・xcconfig 連結・
#   Generated.xcconfig といった不安定要素が一切なくなる。
#   ビルドは「xcodegen generate → xcodebuild」の 2 手順のみ。

name: ViviMusic
options:
  bundleIdPrefix: com.music
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 6 の厳格な並行性チェックを避けるため 5.10 を明示。
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  ViviMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: VIVI Music
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"

        # バックグラウンド再生 (ロック画面・コントロールセンター対応に必須)
        UIBackgroundModes:
          - audio

        # googlevideo の CDN は稀に http へリダイレクトするため緩めておく
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

        # 診断ログを「ファイル」アプリから取り出せるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

        UILaunchScreen:
          UIColorName: ""

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.vivi
        PRODUCT_NAME: ViviMusic
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ENABLE_PREVIEWS: YES
